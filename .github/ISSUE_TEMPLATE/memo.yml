name: 一言メモを追加
description: 寺社の個別ページの「一言メモを追加」から開くフォーム
title: "一言メモ: "
body:
  - type: input
    id: wikidata
    attributes:
      label: Wikidata ID
      description: 寺社のページから開くと自動で入ります。
      placeholder: Q714828
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: 参拝した年月
      description: YYYY-MM（月が分からなければ YYYY）。同じ年月の参拝があればそこにメモを書き足し、なければ新しい参拝として追加します。
      placeholder: "2026-03"
  - type: textarea
    id: memo
    attributes:
      label: 一言メモ
    validations:
      required: true
  - type: dropdown
    id: goshuin
    attributes:
      label: 御朱印
      options:
        - あり
        - なし
      default: 0
    validations:
      required: true
