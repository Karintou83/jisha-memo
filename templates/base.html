<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}寺社メモ{% endblock %}</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="{{ root }}static/style.css">
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="site-header">
    <a href="{{ root }}index.html" class="site-title">寺社メモ</a>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    寺社の情報は <a href="https://www.wikidata.org/">Wikidata</a>（CC0）と <a href="https://ja.wikipedia.org/">Wikipedia</a>（CC BY-SA 4.0）、
    画像は <a href="https://commons.wikimedia.org/">Wikimedia Commons</a> から取得しています。
  </footer>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
