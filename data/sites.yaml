  - wikidata: Q714828  # 伏見稲荷大社
    tags: [総本宮, 二十二社, 日本三大稲荷]
    visits:
      - date: "2023-11"
        memo: 修学旅行で行きました。御朱印デビューはこの神社でした。真っ赤な御朱印帳が非常に素敵。
        goshuin: true
      - date: "2026-03"
        memo: |-
          朱塗りの「千本鳥居」で有名な神社。「千本」といいつつも、実際は約1万本らしい。
          奥の山にも道は続くが、まだ行ったことはない。いつか行ってみたいと思うのだが。
        goshuin: true
